<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSF Inventory – GitHub Database</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f2f5;
      padding: 20px;
    }
    .container { max-width: 1400px; margin: 0 auto; }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      background: white;
      padding: 15px 25px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }
    .header h1 { color: #1a2a3a; font-size: 24px; }
    .header-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .header-actions button {
      padding: 9px 18px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      background: #e9ecef;
      transition: 0.2s;
    }
    .header-actions button:hover { background: #dde1e3; }
    .btn-logout { background: #e74c3c !important; color: white !important; }
    .btn-logout:hover { background: #c0392b !important; }

    /* FORM */
    .form-card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 30px;
    }
    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .form-group { display: flex; flex-direction: column; }
    .form-group label {
      font-weight: 500;
      margin-bottom: 5px;
      font-size: 14px;
      color: #444;
    }
    .form-group input, .form-group select {
      padding: 10px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: #4a6cf7;
      outline: none;
    }
    .form-actions {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .form-actions button {
      padding: 10px 28px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      background: #4a6cf7;
      color: white;
      transition: 0.2s;
    }
    .form-actions button:hover { background: #3a5bd9; }
    .form-actions .btn-clear { background: #95a5a6; }
    .form-actions .btn-clear:hover { background: #7f8c8d; }
    #formMsg { margin-top: 14px; font-weight: 500; color: #27ae60; }

    /* TABLE */
    .table-wrapper {
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 700px; }
    th { background: #f8f9fa; padding: 12px 10px; text-align: left; border-bottom: 2px solid #dee2e6; }
    td { padding: 10px; border-bottom: 1px solid #eee; }
    tr:hover td { background: #fafbfc; }
    .empty-msg { text-align: center; color: #999; padding: 40px 0; }
    .error-box {
      background: #f8d7da;
      color: #721c24;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #f5c6cb;
      margin: 10px 0;
    }

    /* LOGIN PAGE */
    .login-container {
      max-width: 400px;
      margin: 100px auto;
      background: white;
      padding: 40px 35px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }
    .login-container h1 { text-align: center; color: #333; margin-bottom: 8px; }
    .login-container p.sub { text-align: center; color: #777; margin-bottom: 30px; font-size: 14px; }
    .login-container label { display: block; font-weight: 500; color: #444; margin-bottom: 5px; font-size: 14px; }
    .login-container input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 16px;
    }
    .login-container input:focus { border-color: #667eea; outline: none; }
    .login-container button {
      width: 100%;
      padding: 14px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
    }
    .login-container button:hover { background: #5a6fd6; }
    #loginMsg { margin-top: 15px; text-align: center; color: #e74c3c; font-weight: 500; }

    @media print {
      .form-card, .header-actions button { display: none !important; }
      .table-wrapper { box-shadow: none !important; padding: 0 !important; }
      body { background: white !important; }
    }
  </style>
</head>
<body>

  <!-- ============================================================ -->
  <!-- LOGIN PAGE                                                  -->
  <!-- ============================================================ -->
  <div id="loginPage" class="login-container">
    <h1>📦 GSF</h1>
    <p class="sub">Property Management System</p>
    <label for="username">Username</label>
    <input type="text" id="loginUsername" placeholder="Enter username">
    <label for="password">Password</label>
    <input type="password" id="loginPassword" placeholder="Enter password">
    <button onclick="doLogin()">Login</button>
    <div id="loginMsg"></div>
  </div>

  <!-- ============================================================ -->
  <!-- DASHBOARD                                                   -->
  <!-- ============================================================ -->
  <div id="dashboardPage" style="display:none;">
    <div class="container">

      <div class="header">
        <h1>📋 GSF Dashboard</h1>
        <div class="header-actions">
          <button onclick="printTable()">🖨️ Print</button>
          <button onclick="downloadCSV()">⬇️ CSV</button>
          <button class="btn-logout" onclick="doLogout()">🚪 Logout</button>
        </div>
      </div>

      <!-- FORM -->
      <div class="form-card">
        <h3>➕ Add New Item</h3>
        <div class="form-row">
          <div class="form-group"><label>Item name *</label><input type="text" id="itemName" placeholder="e.g. Laptop"></div>
          <div class="form-group"><label>Description</label><input type="text" id="description" placeholder="Brief description"></div>
          <div class="form-group"><label>Serial number</label><input type="text" id="serialNumber" placeholder="SN-123"></div>
          <div class="form-group"><label>Quantity *</label><input type="number" id="quantity" placeholder="1" min="1"></div>
          <div class="form-group"><label>Date</label><input type="date" id="date"></div>
          <div class="form-group"><label>Borrower</label><input type="text" id="borrower" placeholder="Who borrowed?"></div>
          <div class="form-group">
            <label>Condition</label>
            <select id="condition"><option value="New">New</option><option value="Good" selected>Good</option><option value="Fair">Fair</option><option value="Poor">Poor</option></select>
          </div>
        </div>
        <div class="form-actions">
          <button onclick="addRecord()">💾 Save Record</button>
          <button class="btn-clear" onclick="clearForm()">🗑️ Clear</button>
        </div>
        <div id="formMsg"></div>
      </div>

      <!-- TABLE -->
      <div class="table-wrapper">
        <h3>📄 All Records</h3>
        <div id="tableContainer"><div class="empty-msg">⏳ Loading...</div></div>
      </div>

    </div>
  </div>

  <script>
    // ================================================================
    //  CONFIGURATION – REPLACE WITH YOUR VALUES!
    // ================================================================
    const GITHUB_TOKEN = 'YOUR_GITHUB_TOKEN';           // Your Personal Access Token
    const GITHUB_OWNER = 'your-username';               // Your GitHub username
    const GITHUB_REPO  = 'my-app-data';                 // Repository name
    const JSON_FILE_PATH = 'data.json';                 // The file storing all data

    // ================================================================
    //  HELPER: Read data.json from GitHub
    // ================================================================
    async function readData() {
      const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${JSON_FILE_PATH}`;
      const response = await fetch(url, {
        headers: {
          'Authorization': `token ${GITHUB_TOKEN}`,
          'Accept': 'application/vnd.github.v3+json'
        }
      });
      if (!response.ok) throw new Error(`GitHub API error: ${response.status}`);
      const data = await response.json();
      const content = atob(data.content); // Decode from base64
      return {
        data: JSON.parse(content),   // The actual JSON data
        sha: data.sha                // The file's SHA (needed for updates)
      };
    }

    // ================================================================
    //  HELPER: Write data.json to GitHub
    // ================================================================
    async function writeData(data, sha) {
      const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${JSON_FILE_PATH}`;
      const content = btoa(JSON.stringify(data, null, 2)); // Encode to base64
      const response = await fetch(url, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${GITHUB_TOKEN}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: `Update data: ${new Date().toISOString()}`,
          content: content,
          sha: sha
        })
      });
      if (!response.ok) throw new Error(`GitHub API error: ${response.status}`);
      return await response.json();
    }

    // ================================================================
    //  AUTHENTICATION: LOGIN
    // ================================================================
    async function doLogin() {
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const msg = document.getElementById('loginMsg');

      if (!username || !password) {
        msg.textContent = 'Please fill in both fields.';
        return;
      }

      try {
        const { data } = await readData();
        const users = data.users || [];
        const found = users.find(u => u.username === username && u.password === password);

        if (found) {
          msg.textContent = '';
          document.getElementById('loginPage').style.display = 'none';
          document.getElementById('dashboardPage').style.display = 'block';
          loadRecords();
        } else {
          msg.textContent = 'Invalid username or password.';
          msg.style.color = '#e74c3c';
        }
      } catch (err) {
        msg.textContent = 'Error: ' + err.message;
        msg.style.color = '#e74c3c';
      }
    }

    // ================================================================
    //  LOAD RECORDS FROM GITHUB
    // ================================================================
    async function loadRecords() {
      const container = document.getElementById('tableContainer');
      container.innerHTML = '<div class="empty-msg">⏳ Loading data...</div>';

      try {
        const { data } = await readData();
        const inventory = data.inventory || [];

        if (inventory.length === 0) {
          container.innerHTML = '<div class="empty-msg">No records found. Add your first item!</div>';
          return;
        }

        const fieldNames = Object.keys(inventory[0]);
        let html = '<table><thead><tr>';
        fieldNames.forEach(f => html += `<th>${f}</th>`);
        html += '</tr></thead><tbody>';

        inventory.forEach(row => {
          html += '<tr>';
          fieldNames.forEach(f => {
            const val = (row[f] !== undefined && row[f] !== null) ? row[f] : '';
            html += `<td>${val}</td>`;
          });
          html += '</tr>';
        });
        html += '</tbody></table>';
        container.innerHTML = html;

      } catch (err) {
        container.innerHTML = `<div class="error-box">❌ Failed to load: ${err.message}</div>`;
      }
    }

    // ================================================================
    //  ADD NEW RECORD
    // ================================================================
    async function addRecord() {
      const msg = document.getElementById('formMsg');
      msg.textContent = '';
      msg.style.color = '#27ae60';

      const itemName = document.getElementById('itemName').value.trim();
      const quantity = parseInt(document.getElementById('quantity').value);

      if (!itemName) {
        msg.textContent = '⚠️ Item name is required.';
        msg.style.color = '#e74c3c';
        return;
      }
      if (!quantity || quantity < 1) {
        msg.textContent = '⚠️ Quantity must be at least 1.';
        msg.style.color = '#e74c3c';
        return;
      }

      const btn = document.querySelector('.form-actions button:first-child');
      btn.disabled = true;
      btn.textContent = '⏳ Saving...';

      try {
        // 1. Read current data
        const { data, sha } = await readData();
        const inventory = data.inventory || [];

        // 2. Calculate next number
        const nextNumber = inventory.length > 0 ? (inventory[inventory.length - 1]['Number'] || 0) + 1 : 1;

        // 3. Create new record
        const newRecord = {
          'Number': nextNumber,
          'Item name': itemName,
          'Description': document.getElementById('description').value.trim(),
          'Serial number': document.getElementById('serialNumber').value.trim(),
          'Quantity': quantity,
          'Date': document.getElementById('date').value,
          'Borrower': document.getElementById('borrower').value.trim(),
          'Condition': document.getElementById('condition').value
        };

        // 4. Add to array
        inventory.push(newRecord);
        data.inventory = inventory;

        // 5. Write back to GitHub
        await writeData(data, sha);

        msg.textContent = `✅ Record #${nextNumber} added successfully!`;
        msg.style.color = '#27ae60';
        clearForm();
        loadRecords();
        btn.disabled = false;
        btn.textContent = '💾 Save Record';

      } catch (err) {
        msg.textContent = '❌ Error: ' + err.message;
        msg.style.color = '#e74c3c';
        btn.disabled = false;
        btn.textContent = '💾 Save Record';
      }
    }

    // ================================================================
    //  CLEAR FORM
    // ================================================================
    function clearForm() {
      document.getElementById('itemName').value = '';
      document.getElementById('description').value = '';
      document.getElementById('serialNumber').value = '';
      document.getElementById('quantity').value = '';
      document.getElementById('borrower').value = '';
      document.getElementById('condition').value = 'Good';
      document.getElementById('formMsg').textContent = '';
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('date').value = today;
    }

    // ================================================================
    //  PRINT & CSV & LOGOUT
    // ================================================================
    function printTable() { window.print(); }

    function downloadCSV() {
      const table = document.querySelector('#tableContainer table');
      if (!table) { alert('No data to export.'); return; }
      let csv = '';
      const rows = table.querySelectorAll('tr');
      for (let r = 0; r < rows.length; r++) {
        const cols = rows[r].querySelectorAll('td, th');
        const rowData = [];
        for (let c = 0; c < cols.length; c++) {
          rowData.push(cols[c].innerText.replace(/,/g, '').trim());
        }
        csv += rowData.join(',') + '\n';
      }
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'GSF_Records.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function doLogout() {
      document.getElementById('dashboardPage').style.display = 'none';
      document.getElementById('loginPage').style.display = 'block';
      document.getElementById('loginUsername').value = '';
      document.getElementById('loginPassword').value = '';
      document.getElementById('loginMsg').textContent = '';
    }

    // Set default date on load
    document.addEventListener('DOMContentLoaded', function() {
      const today = new Date().toISOString().split('T')[0];
      const dateInput = document.getElementById('date');
      if (dateInput) dateInput.value = today;
    });
  </script>

</body>
</html>
